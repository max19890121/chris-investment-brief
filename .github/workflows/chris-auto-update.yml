name: CHRIS Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * 0-4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data
        shell: python
        run: |
          import json
          import csv
          import io
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode()

          def yahoo(symbol):
              s = urllib.parse.quote(symbol, safe="")
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + s + "?range=10d&interval=1d"
              )
              j = json.loads(get(url))["chart"]["result"][0]
              close = j["indicators"]["quote"][0]["close"]
              v = [float(x) for x in close if x is not None]
              return v[-1], (v[-1] / v[-2] - 1) * 100

          def fred(series):
              url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=" + series
              rows = list(csv.DictReader(io.StringIO(get(url))))
              vals = []
              for r in rows:
                  x = r.get(series)
                  if x and x != ".":
                      vals.append((r["DATE"], float(x)))
              return vals

          def market_item(name, symbol):
              try:
                  value, change = yahoo(symbol)
                  return {
                      "name": name,
                      "value": f"{value:,.2f}",
                      "change": f"{change:+.2f}%",
                      "tone": "up" if change >= 0 else "down"
                  }
              except Exception:
                  return {
                      "name": name,
                      "value": "—",
                      "change": "STALE",
                      "tone": "warn"
                  }

          symbols = [
              ("S&P 500", "^GSPC"),
              ("NASDAQ", "^IXIC"),
              ("SOX", "^SOX"),
              ("DXY", "DX-Y.NYB"),
              ("USD/TWD", "TWD=X"),
              ("GOLD", "GC=F"),
              ("WTI", "CL=F")
          ]

          market = {}
          tickers = []

          for name, symbol in symbols:
              item = market_item(name, symbol)
              tickers.append(item)
              market[name] = item

          fred_data = {}

          for series in ["DGS2", "DGS10", "DGS30", "DFF", "VIXCLS"]:
              try:
                  fred_data[series] = fred(series)
              except Exception:
                  fred_data[series] = []

          def latest(series):
              x = fred_data.get(series, [])
              return x[-1] if x else ("—", None)

          d2, y2 = latest("DGS2")
          d10, y10 = latest("DGS10")
          d30, y30 = latest("DGS30")
          dff, ff = latest("DFF")
          dvix, vix = latest("VIXCLS")

          tickers.insert(3, {
              "name": "US 10Y",
              "value": f"{y10:.2f}%" if y10 is not None else "—",
              "change": d10,
              "tone": "up"
          })

          tickers.append({
              "name": "VIX",
              "value": f"{vix:.2f}" if vix is not None else "—",
              "change": dvix,
              "tone": "up"
          })

          tickers.append({
              "name": "MOVE",
              "value": "—",
              "change": "NO FEED",
              "tone": "warn"
          })

          sector_symbols = [
              ("能源", "XLE"),
              ("工業", "XLI"),
              ("資訊科技", "XLK"),
              ("公用事業", "XLU"),
              ("金融", "XLF"),
              ("非必需消費", "XLY"),
              ("必需消費", "XLP"),
              ("原材料", "XLB"),
              ("房地產", "XLRE"),
              ("通訊服務", "XLC"),
              ("醫療保健", "XLV")
          ]

          sectors = []

          for name, symbol in sector_symbols:
              try:
                  value, change = yahoo(symbol)
                  sectors.append({
                      "name": name,
                      "change": round(change, 2)
                  })
              except Exception:
                  sectors.append({
                      "name": name,
                      "change": 0
                  })

          hist = fred_data.get("DGS10", [])[-20:]
          vhist = fred_data.get("VIXCLS", [])[-20:]

          dates = [x[0][5:] for x in hist]
          yields = [x[1] for x in hist]
          vix_history = [x[1] for x in vhist]

          if len(vix_history) > len(dates):
              vix_history = vix_history[-len(dates):]

          while len(vix_history) < len(dates):
              vix_history.insert(0, None)

          def rate(name, value, date):
              return {
                  "name": name,
                  "value": f"{value:.2f}%" if value is not None else "—",
                  "date": date
              }

          def commodity(name):
              x = market[name]
              return {
                  "name": name,
                  "value": x["value"],
                  "change": x["change"],
                  "tone": x["tone"]
              }

          now = datetime.now(
              timezone(timedelta(hours=8))
          ).strftime("%Y-%m-%d %H:%M Asia/Taipei")

          data = {
              "status": "AUTO · READY",
              "updated_at": now,

              "bluf": {
                  "headline": "全球市場、利率與波動率已自動更新",
                  "brief":
                      "CHRIS 投資早報已進入自動更新模式。"
                      "以美股、科技、長端利率、美元與波動率交叉判讀市場風險偏好。",
                  "theme": "Markets · Rates · Volatility"
              },

              "risk_note":
                  "VIX 與美債使用 FRED 最新可用資料；"
                  "MOVE 未接授權資料源，因此不使用估算數值。",

              "tickers": tickers,

              "risk": [
                  {
                      "name": "VIX",
                      "value": f"{vix:.2f}" if vix is not None else "—",
                      "label": dvix,
                      "tone": "up"
                  },
                  {
                      "name": "US 10Y",
                      "value": f"{y10:.2f}%" if y10 is not None else "—",
                      "label": d10,
                      "tone": "up"
                  },
                  {
                      "name": "MOVE",
                      "value": "—",
                      "label": "NO FEED",
                      "tone": "warn"
                  }
              ],

              "news": [
                  {
                      "title": "Rates",
                      "summary":
                          f"美國 10 年期公債殖利率最新 "
                          f"{y10:.2f}%。" if y10 is not None else "利率資料暫缺。"
                  },
                  {
                      "title": "Equities",
                      "summary":
                          "追蹤 S&P 500、NASDAQ 與 SOX 最新交易日表現。"
                  },
                  {
                      "title": "Volatility",
                      "summary":
                          f"VIX 最新 {vix:.2f}，資料日 {dvix}。"
                          if vix is not None else "VIX 資料暫缺。"
                  },
                  {
                      "title": "Cross Asset",
                      "summary":
                          "同步觀察美元、黃金與原油，確認跨資產風險訊號。"
                  }
              ],

              "watch": [
                  ["US 10Y", "觀察長端利率方向"],
                  ["SOX", "觀察科技風險偏好"],
                  ["VIX", "觀察股票波動率"],
                  ["WTI", "追蹤能源與通膨風險"],
                  ["DXY", "確認美元趨勢"]
              ],

              "sectors": sectors,

              "rates": [
                  rate("US 2Y", y2, d2),
                  rate("US 10Y", y10, d10),
                  rate("US 30Y", y30, d30),
                  rate("Fed Funds", ff, dff)
              ],

              "commodities": [
                  commodity("WTI"),
                  commodity("GOLD")
              ],

              "calendar": [
                  {
                      "time": "—",
                      "country": "US",
                      "event": "經濟行事曆：等待授權資料源",
                      "actual": "—",
                      "forecast": "—",
                      "previous": "—"
                  }
              ],

              "vol_signals": [
                  ["VIX", f"{vix:.2f}" if vix is not None else "—"],
                  ["MOVE", "No licensed feed"],
                  ["US 10Y", f"{y10:.2f}%" if y10 is not None else "—"],
                  ["Regime", "Data Driven"]
              ],

              "fed": [
                  ["Fed Funds", f"{ff:.2f}%" if ff is not None else "—"],
                  ["Data Date", dff],
                  ["FedWatch", "CME 官方入口"]
              ],

              "levels": [
                  {"name": "S&P 500", "text": market["S&P 500"]["value"]},
                  {"name": "NASDAQ", "text": market["NASDAQ"]["value"]},
                  {"name": "SOX", "text": market["SOX"]["value"]},
                  {
                      "name": "US 10Y",
                      "text": f"{y10:.2f}%" if y10 is not None else "—"
                  },
                  {"name": "DXY", "text": market["DXY"]["value"]}
              ],

              "chris_view":
                  "核心框架：利率 × 科技相對強弱 × 波動率。"
                  "三者同步改善時提高風險偏好；"
                  "長端利率與波動率同步上升時提高風險警戒。",

              "sources": [
                  {
                      "name": "FRED",
                      "ok": True,
                      "note": "Treasury、Fed Funds、VIX"
                  },
                  {
                      "name": "Market Feed",
                      "ok": True,
                      "note": "股指、FX、商品與產業 ETF"
                  },
                  {
                      "name": "CME",
                      "ok": True,
                      "note": "FedWatch 使用官方入口"
                  },
                  {
                      "name": "CHRIS CIO Layer",
                      "ok": True,
                      "note": "自動化市場監控框架"
                  }
              ],

              "history": {
                  "dates": dates,
                  "dgs10": yields,
                  "vix": vix_history
              },

              "curve": [
                  y2 or 0,
                  y10 or 0,
                  y30 or 0
              ]
          }

          Path("data").mkdir(exist_ok=True)

          Path("data/brief.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

      - name: Commit data
        run: |
          git config user.name "CHRIS Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/brief.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto update CHRIS morning brief"
          git push
