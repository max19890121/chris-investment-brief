name: CHRIS Auto Update

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 07:05
    - cron: "5 23 * * 0-4"

permissions:
  contents: write

concurrency:
  group: chris-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install holdings reader
        run: python -m pip install openpyxl==3.1.5

      - name: Update verified morning brief
        run: python scripts/update_brief.py

      - name: Update observed stock volatility
        run: python scripts/update_volatility.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit updated data
        run: |
          git config user.name "CHRIS Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update CHRIS verified brief and volatility"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
